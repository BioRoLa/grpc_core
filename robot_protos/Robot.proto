syntax = "proto3";

package robot_msg;
import "std.proto";

enum ROBOTMODE {
    UNINITIALIZED=0;  // motors off (was SYSTEM_ON)
    INIT=1;
    IDLE=2;
    ACTIVE=3;         // commands accepted (was STANDBY)
    CONFIG=4;         // motor config (was MOTORCONFIG)
}

message RobotCmdStamped {
    std_msg.Header header = 1;
    ROBOTMODE request_robot_mode = 2;
}

message RobotStateStamped {
    std_msg.Header header = 1;
    ROBOTMODE robot_mode = 2;
}